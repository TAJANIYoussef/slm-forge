# filler cues (en). Patterns are regexes on L1 text; 'skeleton' patterns run on the L2 skeleton.
version: 1
kind: filler
bucket: en
entries:
- id: en.filler.sorry
  category: apology
  strength: strong
  pattern: \b(?:sorry|i apologi[sz]e)\b
- id: en.filler.as_an_ai
  category: self_reference
  strength: strong
  pattern: '\bas an ai\b(?: (?:language )?model)?'
- id: en.filler.disclaimer
  category: disclaimer
  strength: strong
  pattern: \b(?:i'?m not a (?:lawyer|financial advisor)|this is not (?:legal|financial) advice)\b
  note: 'domain disclaimer: neither a hedge nor an abstention'
