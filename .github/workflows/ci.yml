name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-minimal:
    # Torch-free install: validation, scoring core, CLI wiring.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/slmforge
      - run: uv run pytest tests/unit/core -q
        env:
          HF_HUB_OFFLINE: "1"

  full-cpu:
    # CPU torch + transformers + peft; integration tests on a tiny model (from M2).
    runs-on: ubuntu-latest
    needs: core-minimal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.11
      - run: uv pip install --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,hf]"
      - run: uv run pytest tests -q -m "not gpu and not slow and not network"
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
