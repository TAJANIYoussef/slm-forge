# QLoRA fine-tune of Phi-4-mini-instruct (3.8B) on Darija/French/English chat data.
#
# Phi-4-mini is model_type phi3 with FUSED projections: target_modules auto resolves to
# qkv_proj, o_proj, gate_up_proj, down_proj. Unsloth's repackaged ("llamafied") Phi bases split
# q/k/v, so an adapter trained on one cannot be loaded on the other; keep name_or_path identical
# for training and eval (the adapter manifest records it and eval exits 3 on a mismatch).
schema_version: 1

run:
  name: phi-4-mini-darija
  output_dir: runs
  seed: 1234

model:
  name_or_path: microsoft/Phi-4-mini-instruct
  revision: null             # pin a 40-char commit SHA for a citable run
  dtype: bf16
  max_seq_length: 2048
  attn_implementation: sdpa
  trust_remote_code: false   # natively supported by recent transformers

quant:
  load_in_4bit: true
  quant_type: nf4
  compute_dtype: bf16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto       # phi3: qkv_proj o_proj gate_up_proj down_proj

data:
  train:
    - {path: data/train/darija_finance.jsonl, format: chat}
    - {path: data/train/fr_legal.jsonl, format: alpaca}
  eval_loss: data/dev/mixed_dev.jsonl
  language_sampling_alpha: 0.5
  sampling_key: lang_script
  abstention_mix: {path: data/train/unanswerable.jsonl, ratio: 0.05}
  contamination_guard: {policy: error}

train:
  backend: auto
  max_steps: 1000
  per_device_batch_size: 4
  grad_accum: 4
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  optim: paged_adamw_8bit
  save_steps: 100
  save_total_limit: null
  logging_steps: 10

eval:
  ground_truth: data/eval/ground_truth.jsonl
  split: test
  schedule: {mode: posthoc, every_n_steps: 200}
  subsample: {fraction: 0.25, min_per_stratum: 20, seed: 7}
  generation: {batch_size: 16, quantization: match_training}
  scoring:
    confidence: {tau: 0.5}
