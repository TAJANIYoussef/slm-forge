[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slm-forge"
version = "0.0.1"
description = "Fine-tuning and factual-reliability evaluation harness for small language models in Darija, French and English"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Youssef Tajani" }]
keywords = ["llm", "fine-tuning", "lora", "evaluation", "hallucination", "darija", "arabic", "multilingual"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core install is torch-free: enough for `data validate`, `score`, `rescore` and `report`.
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Generation, HF+PEFT training (CPU/MPS/CUDA) and task metrics.
hf = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "tokenizers>=0.19",
    "sacrebleu>=2.4",
]
# 4-bit QLoRA; bitsandbytes needs CUDA.
qlora = ["bitsandbytes>=0.43; platform_system == 'Linux'"]
# Unsloth backend (NVIDIA CUDA only). Pin exact versions in requirements/cuda-unsloth.lock.
unsloth = ["unsloth", "unsloth_zoo"]
# Darija skeleton matching (M4).
darija = ["rapidfuzz>=3.6"]
# Teacher-model distillation (optional, ToS-gated, see docs/distillation-terms.md).
distill = ["anthropic>=0.40", "openai>=1.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    # Test oracles only; never imported by the package.
    "scipy>=1.13",
]

[project.scripts]
slm-forge = "slmforge.cli:main"

[project.urls]
Homepage = "https://github.com/TAJANIYoussef/slm-forge"

[tool.hatch.build.targets.wheel]
packages = ["src/slmforge"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic and typographic characters are intentional
    "B008",                         # typer option defaults
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src/slmforge"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (nightly)",
    "gpu: needs a CUDA GPU",
    "hf: needs the [hf] extra (torch, transformers, peft)",
    "network: needs network access",
]
